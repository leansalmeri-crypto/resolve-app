<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><p style="font-family:system-ui;padding:24px">Cargando RESOLVÉ…</p><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/leansalmeri-crypto/resolve-app/main/index.html?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('No se pudo leer la aplicación');const s=await r.text();const m=s.match(/const b64='([^']+)'/);if(!m)throw new Error('No se encontró el paquete de la aplicación');const bytes=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const text=pako.ungzip(bytes,{to:'string'});document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:24px">No se pudo cargar RESOLVÉ. Recargá la página.</p>';console.error(e)}})();</script></body></html>
