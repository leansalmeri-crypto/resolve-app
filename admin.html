<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración RESOLVÉ</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f1e8;color:#14233a}.wrap{max-width:1050px;margin:auto;padding:18px}h1{margin:6px 0}.sub{color:#657184}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.kpi b{display:block;font-size:30px;color:#173b67}.kpi span{font-size:13px;color:#687386}input,button{width:100%;padding:12px;border-radius:11px;border:1px solid #ccd3dc;margin:6px 0;font:inherit}button{border:0;background:#173b67;color:white;font-weight:700;cursor:pointer}.danger{background:#a53b3b}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{width:auto}.item{padding:12px 0;border-bottom:1px solid #eee}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef3f8;font-size:12px}.bad{color:#a12626}.ok{color:#26733c}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><h1>RESOLVÉ · Administración</h1><p class="sub">Panel privado de actividad de la aplicación.</p><section id="login" class="card"><h2>Ingresar</h2><input id="email" type="email" placeholder="Email administrador"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">INGRESAR</button><div id="msg"></div></section><section id="panel" class="hidden"><div class="row"><button id="refresh">Actualizar</button><button id="logout" class="danger">Cerrar sesión</button></div><div id="who" class="sub"></div><div class="grid" id="kpis"></div><div class="card"><h2>Altas recientes</h2><div id="users">Cargando…</div></div><div class="card"><h2>Solicitudes y presupuestos</h2><div id="requests">Cargando…</div></div><div class="card"><h2>Bolsa de empleo</h2><div id="jobs">Cargando…</div></div><div class="card"><h2>Postulaciones</h2><div id="apps">Cargando…</div></div><div class="card"><h2>Valoraciones</h2><div id="reviews">Cargando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://birlzgiwoswenizlsmqu.supabase.co',KEY='sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(x){try{return x?new Date(x).toLocaleString('es-AR'):'—'}catch{return '—'}}async function adminOK(user){if(!user)return false;const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();return p?.role==='admin'}async function enter(){const {data:{user}}=await sb.auth.getUser();if(!user){$('login').classList.remove('hidden');$('panel').classList.add('hidden');return}if(!(await adminOK(user))){$('msg').innerHTML='<p class="bad">Esta cuenta no tiene permiso de administrador.</p>';await sb.auth.signOut();return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent='Sesión: '+user.email;load()}$('loginBtn').onclick=async()=>{ $('msg').textContent='Ingresando…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').innerHTML='<p class="bad">No se pudo ingresar.</p>';return}$('msg').textContent='';enter()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;function list(el,arr,render){$(el).innerHTML=arr?.length?arr.map(render).join(''):'<p class="sub">Sin registros.</p>'}async function load(){const [p,r,j,a,v]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(100),sb.from('service_requests').select('*').order('created_at',{ascending:false}).limit(100),sb.from('job_posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('job_applications').select('*').order('created_at',{ascending:false}).limit(100),sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(100)]);const profiles=p.data||[],req=r.data||[],jobs=j.data||[],apps=a.data||[],reviews=v.data||[];const pros=profiles.filter(x=>x.role==='professional').length,completed=req.filter(x=>x.status==='completed').length;$('kpis').innerHTML=[['Usuarios',profiles.length],['Profesionales',pros],['Solicitudes',req.length],['Completados',completed],['Empleos',jobs.length],['Postulaciones',apps.length],['Valoraciones',reviews.length]].map(x=>`<div class="card kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');list('users',profiles,x=>`<div class="item"><b>${esc(x.full_name||x.email||'Usuario')}</b> <span class="tag">${esc(x.role||'client')}</span><br><span class="sub">${esc(x.trade||'')} ${esc(x.zone||'')} · ${date(x.created_at)}</span></div>`);list('requests',req,x=>`<div class="item"><b>${esc(x.category||x.trade||'Solicitud')}</b> <span class="tag">${esc(x.status||'pending')}</span><br>${esc(x.description||'')}<br><span class="sub">${date(x.created_at)}${x.quote_amount!=null?' · Presupuesto $'+esc(x.quote_amount):''}</span></div>`);list('jobs',jobs,x=>`<div class="item"><b>${esc(x.title||'Búsqueda')}</b><br>${esc(x.description||'')}<br><span class="sub">${date(x.created_at)}</span></div>`);list('apps',apps,x=>`<div class="item"><b>Postulación</b> <span class="tag">${esc(x.status||'enviada')}</span><br><span class="sub">${date(x.created_at)}</span></div>`);list('reviews',reviews,x=>`<div class="item"><b>${'★'.repeat(Math.max(0,Math.min(5,Number(x.rating)||0)))}</b><br>${esc(x.comment||'')}<br><span class="sub">${date(x.created_at)}</span></div>`)}enter();</script></body></html>
