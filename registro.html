<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crear cuenta · RESOLVÉ</title><meta name="theme-color" content="#244f75"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f2e8;color:#23344d;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px #173b6720}.brand{font-weight:900;font-size:24px;color:#244f75;margin-bottom:4px}.sub{color:#6a7787;margin:0 0 18px}.field{display:block;width:100%;height:52px;padding:0 14px;border:1px solid #d7dee8;border-radius:14px;font-size:16px;background:#fff;color:#1f2f46;margin:10px 0;appearance:none;-webkit-appearance:none;pointer-events:auto;touch-action:manipulation}.pass{position:relative}.pass .field{padding-right:54px}.eye{position:absolute;right:7px;top:15px;width:40px;height:40px;border:0;border-radius:10px;background:#f2f4f7;font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#ef6658;color:white;font-size:16px;font-weight:900;margin-top:8px}.link{display:block;text-align:center;margin-top:14px;color:#244f75;font-weight:700;text-decoration:none}.msg{min-height:24px;margin-top:12px;font-size:14px}.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#244f75;font-weight:700}</style></head><body><main class="card"><a class="back" href="/">← Volver</a><div class="brand">RESOLVÉ</div><p class="sub">Creá tu cuenta gratis.</p><input id="name" class="field" type="text" autocomplete="name" placeholder="Nombre y apellido"><input id="email" class="field" type="email" inputmode="email" autocomplete="email" placeholder="Email"><div class="pass"><input id="password" class="field" type="password" autocomplete="new-password" placeholder="Contraseña"><button class="eye" type="button" data-for="password" aria-label="Mostrar contraseña">👁️</button></div><div class="pass"><input id="password2" class="field" type="password" autocomplete="new-password" placeholder="Repetir contraseña"><button class="eye" type="button" data-for="password2" aria-label="Mostrar contraseña">👁️</button></div><button id="create" class="btn" type="button">CREAR MI CUENTA GRATIS</button><div id="msg" class="msg"></div><a class="link" href="/ingresar.html">Ya tengo cuenta · Ingresar</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL');document.querySelectorAll('.eye').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.for);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈';i.focus()}));document.getElementById('create').addEventListener('click',async()=>{const msg=document.getElementById('msg'),name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),p=document.getElementById('password').value,p2=document.getElementById('password2').value;if(!name||!email||!p||!p2){msg.textContent='Completá todos los campos.';msg.style.color='#a33';return}if(p.length<6){msg.textContent='La contraseña debe tener al menos 6 caracteres.';msg.style.color='#a33';return}if(p!==p2){msg.textContent='Las contraseñas no coinciden.';msg.style.color='#a33';return}msg.textContent='Creando cuenta…';msg.style.color='#52657a';const{data,error}=await sb.auth.signUp({email,password:p,options:{data:{full_name:name,role:'client'}}});if(error){msg.textContent=error.message.includes('registered')?'Ese email ya está registrado.':'No se pudo crear la cuenta. Revisá los datos e intentá nuevamente.';msg.style.color='#a33';return}msg.textContent=data.session?'Cuenta creada. Entrando…':'Cuenta creada. Revisá tu email si te pide confirmación.';msg.style.color='#18794e';setTimeout(()=>{location.href=data.session?'/?registro=ok':'/ingresar.html?registro=ok'},700)});</script></body></html>
