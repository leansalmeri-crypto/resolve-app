<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ · Nueva contraseña</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef6fa;color:#10283d}.head{padding:30px 22px;background:linear-gradient(135deg,#0d4169,#175a8b);color:#fff;border-radius:0 0 28px 28px}.head h1{margin:0}.wrap{max-width:620px;margin:auto;padding:18px 16px}.card{background:#fff;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #173c551a}.field{position:relative}input{width:100%;padding:16px;border:1px solid #dbe6ec;border-radius:15px;background:#fbfdfe;font:inherit;margin:6px 0}.eye{position:absolute;right:10px;top:11px;width:44px;height:44px;border:0;background:transparent;font-size:21px}.primary{width:100%;padding:16px;border:0;border-radius:15px;background:#175a8b;color:#fff;font:inherit;font-weight:800;margin-top:14px}.msg{margin-top:14px;padding:13px;border-radius:13px;background:#eaf5fb}.ok{background:#e8f7f2}.warn{background:#fff4dd}.hidden{display:none}.note{color:#6c7d8c;line-height:1.45}</style></head><body><header class="head"><h1>RESOLVÉ</h1><div>Recuperación de contraseña</div></header><main class="wrap"><div class="card"><h2>Elegí una nueva contraseña</h2><p class="note">Usá al menos 6 caracteres y repetila para confirmar.</p><div class="field"><input id="p1" type="password" minlength="6" placeholder="Nueva contraseña"><button id="e1" class="eye" type="button">👁</button></div><div class="field"><input id="p2" type="password" minlength="6" placeholder="Repetir contraseña"><button id="e2" class="eye" type="button">👁</button></div><button id="save" class="primary">Guardar nueva contraseña</button><div id="msg" class="msg hidden"></div></div></main><script>(function(){const $=id=>document.getElementById(id),SHARE=new URLSearchParams(location.search).get('_vercel_share')||'';function show(t,ok){$('msg').textContent=t;$('msg').classList.remove('hidden','ok','warn');$('msg').classList.add(ok?'ok':'warn')}function eye(b,i){b.onclick=()=>{i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}}eye($('e1'),$('p1'));eye($('e2'),$('p2'));const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});$('save').onclick=async()=>{const a=$('p1').value,b=$('p2').value;if(a.length<6)return show('La contraseña debe tener al menos 6 caracteres.',false);if(a!==b)return show('Las contraseñas no coinciden.',false);const r=await db.auth.updateUser({password:a});if(r.error)return show('No pudimos cambiar la contraseña: '+r.error.message,false);show('✓ Contraseña actualizada. Ya podés ingresar.',true);setTimeout(()=>{const u=new URL('/v3/',location.origin);if(SHARE)u.searchParams.set('_vercel_share',SHARE);location.href=u.href},900)}})();</script></body></html>
