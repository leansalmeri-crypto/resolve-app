<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ v3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fa;color:#17324d}.top{background:#244f75;color:white;padding:22px;text-align:center}.wrap{max-width:600px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #17324d12}input,select,textarea,button{width:100%;padding:13px;border-radius:11px;border:1px solid #ccd6df;margin:6px 0;font:inherit}button{background:#244f75;color:white;border:0;font-weight:700}.secondary{background:#eef3f7;color:#244f75}.hidden{display:none}.msg,.item{padding:12px;background:#eef3f7;border-radius:11px;margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;border-top:1px solid #ddd;padding:6px;gap:4px}.nav button{font-size:12px;padding:9px 3px}.space{height:75px}</style></head><body><header class="top"><h1 style="margin:0">RESOLVÉ</h1><div>Encontrá profesionales de confianza</div></header><main class="wrap">
<section id="guest"><div class="card"><h2>Ingresar</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Contraseña"><button id="loginBtn">Ingresar a mi cuenta</button><div id="loginMsg"></div></div><div class="card"><h2>Crear cuenta gratis</h2><input id="name" placeholder="Nombre y apellido"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><input id="password2" type="password" placeholder="Repetir contraseña"><select id="role"><option value="client">Soy cliente</option><option value="professional">Soy profesional</option></select><input id="phone" placeholder="Teléfono"><button id="signupBtn">Crear mi cuenta</button><div id="signupMsg"></div></div></section>
<section id="home" class="hidden"><div class="card"><h2>¿Qué necesitás?</h2><button onclick="go('search');loadPros()">Buscar profesional</button><button class="secondary" onclick="go('jobs');loadJobs()">Bolsa de trabajo</button></div></section>
<section id="search" class="hidden"><div class="card"><h2>Buscar profesional</h2><input id="tradeSearch" placeholder="Oficio"><input id="zoneSearch" placeholder="Zona"><button onclick="loadPros()">Buscar</button><div id="pros"></div></div></section>
<section id="jobs" class="hidden"><div class="card"><h2>Bolsa de trabajo</h2><div id="jobsList"></div></div></section>
<section id="account" class="hidden"><div class="card"><h2>Mi cuenta</h2><div id="accountData" class="msg"></div><div id="proForm" class="hidden"><input id="trade" placeholder="Tu oficio"><input id="zone" placeholder="Tu zona"><textarea id="bio" placeholder="Experiencia y descripción"></textarea><button onclick="savePro()">Guardar perfil profesional</button><div id="profileMsg"></div></div><h3>Actividad</h3><div id="activity"></div><button id="logoutBtn" class="secondary">Cerrar sesión</button></div></section><div class="space"></div></main>
<nav class="nav"><button onclick="go('home')">Inicio</button><button onclick="go('search');loadPros()">Buscar</button><button onclick="go('jobs');loadJobs()">Trabajo</button><button onclick="openAccount()">Mi cuenta</button></nav>
<script src="professionals.js"></script><script src="requests.js"></script><script src="reviews.js"></script><script src="jobs.js"></script><script>
const db=supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=x=>document.getElementById(x);let session,profile;function go(id){['guest','home','search','jobs','account'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function msg(id,t){$(id).innerHTML=t?'<div class="msg">'+t+'</div>:''}async function boot(){session=(await db.auth.getSession()).data.session;if(!session)return go('guest');let r=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=r.data;go('home')}
$('signupBtn').onclick=async()=>{let n=$('name').value.trim(),e=$('email').value.trim(),p=$('password').value;if(!n||!e||!p)return msg('signupMsg','Completá los datos.');if(p.length<6)return msg('signupMsg','La contraseña debe tener al menos 6 caracteres.');if(p!==$('password2').value)return msg('signupMsg','Las contraseñas no coinciden.');let r=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n,role:$('role').value,phone:$('phone').value.trim()}}});if(r.error)return msg('signupMsg',r.error.message);if(r.data.user)await db.from('profiles').upsert({id:r.data.user.id,full_name:n,role:$('role').value,phone:$('phone').value.trim()});msg('signupMsg',r.data.session?'Cuenta creada.':'Cuenta creada. Revisá tu email para confirmarla.');boot()};$('loginBtn').onclick=async()=>{let r=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error)return msg('loginMsg','No pudimos ingresar: '+r.error.message);boot()};$('logoutBtn').onclick=async()=>{await db.auth.signOut();session=null;profile=null;go('guest')};async function openAccount(){if(!session)return go('guest');let r=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=r.data;go('account');$('accountData').innerHTML='<b>'+(profile?.full_name||session.user.email)+'</b><br>'+(profile?.role==='professional'?'Profesional':'Cliente')+'<br>'+session.user.email;$('proForm').classList.toggle('hidden',profile?.role!=='professional');if(profile?.role==='professional'){$('trade').value=profile.trade||'';$('zone').value=profile.zone||'';$('bio').value=profile.bio||''}let rr=profile?.role==='professional'?await resolveProfessionalRequests(db,session.user.id):await resolveClientRequests(db,session.user.id);$('activity').innerHTML=rr.data?.length?rr.data.map(x=>'<div class="item"><b>'+safe(x.trade)+'</b><br>'+safe(x.description)+'<br>Estado: '+safe(x.status)+(x.quote_amount?'<br>Presupuesto: $'+x.quote_amount:'')+'</div>').join(''):'Todavía no hay actividad.'}async function savePro(){let r=await resolveSaveProfessionalProfile(db,session.user.id,{trade:$('trade').value.trim(),zone:$('zone').value.trim(),bio:$('bio').value.trim()});msg('profileMsg',r.error?r.error.message:'Perfil guardado correctamente.')}async function loadPros(){let r=await resolveSearchProfessionals(db,$('tradeSearch').value.trim(),$('zoneSearch').value.trim());$('pros').innerHTML=r.data?.length?r.data.map(p=>'<div class="item"><b>'+safe(p.full_name)+'</b><br>'+safe(p.trade||'Profesional')+(p.zone?'<br>'+safe(p.zone):'')+(p.rating?'<br>⭐ '+Number(p.rating).toFixed(1):'')+(p.bio?'<p>'+safe(p.bio)+'</p>':'')+'</div>').join(''):'No encontramos profesionales.'}async function loadJobs(){let r=await resolveListJobs(db);$('jobsList').innerHTML=r.data?.length?r.data.map(j=>'<div class="item"><b>'+safe(j.title)+'</b><br>'+safe(j.description)+(j.zone?'<br>Zona: '+safe(j.zone):'')+'</div>').join(''):'Todavía no hay búsquedas activas.'}function safe(v){let d=document.createElement('div');d.textContent=v||'';return d.innerHTML}db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();</script></body></html>
