<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ prueba</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef6fa;color:#10283d}.head{padding:28px 22px;background:linear-gradient(135deg,#0d4169,#175a8b);color:white;border-radius:0 0 28px 28px}.head h1{margin:0}.wrap{max-width:620px;margin:auto;padding:18px 16px 40px}.card{background:#fff;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #173c551a}.badge{display:inline-block;background:#e8f7f2;color:#16644e;border-radius:99px;padding:7px 11px;font-weight:800;font-size:12px}h2{font-size:27px}label{display:block;font-weight:700;margin-top:12px}.field{position:relative}input,select{width:100%;padding:16px;border:1px solid #dbe6ec;border-radius:15px;background:#fbfdfe;font:inherit;margin:6px 0}.eye{position:absolute;right:10px;top:11px;width:44px;height:44px;border:0;background:transparent;font-size:21px}button.primary{width:100%;padding:16px;border:0;border-radius:15px;background:#175a8b;color:white;font:inherit;font-weight:800;margin-top:14px}.msg{margin-top:14px;padding:13px;border-radius:13px;background:#eaf5fb}.ok{background:#e8f7f2}.hidden{display:none}.note{color:#6c7d8c;font-size:14px}</style></head><body><header class="head"><h1>RESOLVÉ</h1><div>Prueba segura de registro</div></header><main class="wrap"><div class="card"><span class="badge">PRUEBA DE REGISTRO</span><h2>Crear mi cuenta</h2><p class="note">Esta pantalla prueba alta, contraseña y conexión. No afecta la versión pública.</p><form id="signupForm"><label>Nombre y apellido</label><input id="name" autocomplete="name" required><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Contraseña</label><div class="field"><input id="password" type="password" autocomplete="new-password" minlength="6" required><button class="eye" id="eye1" type="button">👁</button></div><label>Repetir contraseña</label><div class="field"><input id="password2" type="password" autocomplete="new-password" minlength="6" required><button class="eye" id="eye2" type="button">👁</button></div><label>Tipo de cuenta</label><select id="role"><option value="client">Necesito contratar un profesional</option><option value="professional">Quiero ofrecer mis servicios</option></select><label>Teléfono</label><input id="phone" type="tel" inputmode="tel" required><button class="primary" id="submit" type="submit">Crear cuenta gratis</button></form><div id="status" class="msg hidden"></div></div><div class="card"><h2>Ingresar</h2><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><div class="field"><input id="loginPassword" type="password" placeholder="Contraseña" required><button class="eye" id="eye3" type="button">👁</button></div><button class="primary" type="submit">Ingresar</button></form><div id="loginStatus" class="msg hidden"></div></div></main><script>(function(){'use strict';const el=id=>document.getElementById(id);function show(id,text,ok){const x=el(id);x.textContent=text;x.classList.remove('hidden','ok');if(ok)x.classList.add('ok')}function eye(button,input){button.onclick=function(){input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'👁':'🙈'}}eye(el('eye1'),el('password'));eye(el('eye2'),el('password2'));eye(el('eye3'),el('loginPassword'));if(!window.supabase){show('status','No se pudo cargar la conexión segura.',false);return}const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});function next(role){location.href='./welcome.html?role='+(role==='professional'?'professional':'client')}el('signupForm').onsubmit=async function(ev){ev.preventDefault();const b=el('submit'),name=el('name').value.trim(),email=el('email').value.trim(),password=el('password').value,password2=el('password2').value,phone=el('phone').value.trim(),role=el('role').value;if(password!==password2)return show('status','Las contraseñas no coinciden.',false);b.disabled=true;b.textContent='Creando cuenta…';try{const r=await db.auth.signUp({email,password,options:{data:{full_name:name,role,phone}}});if(r.error)throw r.error;if(r.data.user&&r.data.session){const p=await db.from('profiles').upsert({id:r.data.user.id,full_name:name,role,phone}).select('*').single();if(p.error)throw p.error;show('status','✓ Cuenta creada. Entrando a RESOLVÉ…',true);setTimeout(()=>next(role),500)}else show('status','✓ Cuenta creada. Revisá tu email para confirmarla. Después ingresá.',true)}catch(err){show('status','No pudimos crear la cuenta: '+(err.message||'error desconocido'),false)}finally{b.disabled=false;b.textContent='Crear cuenta gratis'}};el('loginForm').onsubmit=async function(ev){ev.preventDefault();show('loginStatus','Ingresando…',false);try{const r=await db.auth.signInWithPassword({email:el('loginEmail').value.trim(),password:el('loginPassword').value});if(r.error)throw r.error;const p=await db.from('profiles').select('role').eq('id',r.data.user.id).maybeSingle();const role=p.data?.role||r.data.user.user_metadata?.role||'client';show('loginStatus','✓ Ingreso correcto. Entrando…',true);setTimeout(()=>next(role),400)}catch(err){show('loginStatus','No pudimos ingresar: '+(err.message||'error desconocido'),false)}}})();</script></body></html>
