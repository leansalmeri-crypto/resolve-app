<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RESOLVÉ v3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#17324d}.top{background:#244f75;color:#fff;padding:22px 18px;text-align:center}.top h1{margin:0;font-size:28px}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17324d12}h2{margin-top:0}input,select,textarea,button{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd6df;margin:7px 0;font:inherit}button{background:#244f75;color:white;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef3f7;color:#244f75}.hidden{display:none}.msg{padding:12px;border-radius:10px;background:#eef3f7;margin:10px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:8px}.nav button{max-width:180px;margin:0 4px;padding:10px}.spacer{height:80px}
</style>
</head><body>
<header class="top"><h1>RESOLVÉ</h1><div>Encontrá profesionales de confianza</div></header>
<main class="wrap">
<section id="guest">
<div class="card"><h2>Ingresar</h2><input id="loginEmail" type="email" placeholder="Email" autocomplete="email"><input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="loginBtn">Ingresar a mi cuenta</button><div id="loginMsg"></div></div>
<div class="card"><h2>Crear cuenta gratis</h2><input id="name" placeholder="Nombre y apellido"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)"><input id="password2" type="password" placeholder="Repetir contraseña"><select id="role"><option value="client">Soy cliente</option><option value="professional">Soy profesional</option></select><input id="phone" type="tel" placeholder="Teléfono"><button id="signupBtn">Crear mi cuenta</button><div id="signupMsg"></div></div>
</section>
<section id="account" class="hidden"><div class="card"><h2>Mi cuenta</h2><div id="accountData" class="msg">Cargando…</div><button id="logoutBtn" class="secondary">Cerrar sesión</button></div></section>
<div class="spacer"></div>
</main>
<nav class="nav"><button id="homeBtn" class="secondary">Inicio</button><button id="accountBtn">Mi cuenta</button></nav>
<script>
const URL='https://birlzgiwoswenizlsmqu.supabase.co';
const KEY='sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
function message(id,text){$(id).innerHTML=text?'<div class="msg">'+text+'</div>':''}
async function showSession(){const {data:{session}}=await db.auth.getSession();if(!session){$('guest').classList.remove('hidden');$('account').classList.add('hidden');return}$('guest').classList.add('hidden');$('account').classList.remove('hidden');const {data:p}=await db.from('profiles').select('full_name,role,phone,trade,zone,bio').eq('id',session.user.id).maybeSingle();$('accountData').innerHTML='<b>'+(p?.full_name||session.user.email)+'</b><br>'+((p?.role==='professional')?'Profesional':'Cliente')+(p?.trade?'<br>Oficio: '+p.trade:'')+(p?.zone?'<br>Zona: '+p.zone:'')+'<br>'+session.user.email}
$('signupBtn').onclick=async()=>{message('signupMsg','');const name=$('name').value.trim(),email=$('email').value.trim(),pass=$('password').value,pass2=$('password2').value,role=$('role').value,phone=$('phone').value.trim();if(!name||!email||!pass)return message('signupMsg','Completá nombre, email y contraseña.');if(pass.length<6)return message('signupMsg','La contraseña debe tener al menos 6 caracteres.');if(pass!==pass2)return message('signupMsg','Las contraseñas no coinciden.');const {data,error}=await db.auth.signUp({email,password:pass,options:{data:{full_name:name,role,phone}}});if(error)return message('signupMsg',error.message);if(data.user){await db.from('profiles').upsert({id:data.user.id,full_name:name,role,phone});}message('signupMsg',data.session?'Cuenta creada. Ya ingresaste.':'Cuenta creada. Revisá tu email para confirmar la cuenta.');await showSession()};
$('loginBtn').onclick=async()=>{message('loginMsg','');const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)return message('loginMsg','No pudimos ingresar: '+error.message);await showSession()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();await showSession()};$('homeBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('accountBtn').onclick=async()=>{await showSession();window.scrollTo({top:0,behavior:'smooth'})};db.auth.onAuthStateChange(()=>setTimeout(showSession,0));showSession();
</script></body></html>
