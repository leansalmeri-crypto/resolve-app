<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ QA Presupuestos</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef6fa;color:#10283d}.head{padding:24px 20px;background:linear-gradient(135deg,#0d4169,#175a8b);color:#fff;border-radius:0 0 26px 26px}.wrap{max-width:620px;margin:auto;padding:16px 14px 100px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 30px #173c5515}.badge{display:inline-block;background:#fff4dd;color:#6b5314;border-radius:99px;padding:7px 11px;font-weight:800;font-size:12px}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:#175a8b;color:#fff;font-weight:800;margin-top:10px;font:inherit}.secondary{background:#eaf5fb;color:#0d4169}.danger{background:#fff0f0;color:#9b2226}.hidden{display:none!important}.lead,.muted{color:#6c7d8c}.result{border:1px solid #dbe6ec;border-radius:17px;padding:15px;margin:10px 0;background:#fbfdfe}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#edf4f8;font-size:12px;font-weight:700}.status{padding:12px;border-radius:12px;background:#e8f7f2;margin-top:10px}.empty{padding:12px;border-radius:12px;background:#fff4dd;color:#6b5314;margin-top:10px}.quote{background:#f2f8fc;border:1px solid #d6e7f0;border-radius:16px;padding:14px;margin-top:12px}.price{font-size:27px;font-weight:900;color:#0d4169;margin:8px 0}input,textarea{width:100%;padding:15px;border:1px solid #dbe6ec;border-radius:14px;background:#fbfdfe;font:inherit;margin:6px 0}textarea{min-height:90px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stars{display:flex;gap:3px}.star{font-size:35px;border:0;background:none;color:#c8d0d6}.star.on{color:#f5b301}.switch{position:sticky;top:8px;z-index:4}</style></head><body><header class="head"><h1 style="margin:0">RESOLVÉ</h1><div>Prueba completa del circuito de presupuesto</div></header><main class="wrap"><div class="card switch"><span class="badge">MODO QA · MISMO CELULAR</span><h2 id="roleTitle">Vista cliente</h2><button id="switchRole" class="primary secondary">Ver como profesional</button></div><section id="client"><div class="card"><h2>Mis solicitudes</h2><p class="lead">Acá ves el pedido y la respuesta del profesional.</p><div id="clientList"></div></div></section><section id="professional" class="hidden"><div class="card"><h2>Pedidos de presupuesto</h2><p class="lead">El cliente cuenta qué necesita. Vos definís el importe y el detalle.</p><div id="proList"></div></div></section></main><script>(function(){const $=id=>document.getElementById(id);let role='client';const key='resolveQaRequests';function list(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function save(x){localStorage.setItem(key,JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0))}const labels={pending:'Esperando presupuesto',quoted:'Presupuesto recibido',accepted:'Presupuesto aceptado',cancelled:'Presupuesto rechazado',completed:'Trabajo completado',reviewed:'Valorado'};function renderClient(){const box=$('clientList'),xs=list();box.innerHTML='';if(!xs.length){box.innerHTML='<div class="empty">No encontramos pedidos QA en este teléfono. Volvé al enlace anterior, hacé un pedido y después abrí nuevamente esta prueba.</div>';return}xs.forEach(x=>{const d=document.createElement('div');d.className='result';let a='';if(x.status==='pending')a='<div class="status">Tu pedido fue enviado. Esperando el presupuesto del profesional.</div>';if(x.status==='quoted')a='<div class="quote"><b>PRESUPUESTO DEL PROFESIONAL</b><div class="price">'+money(x.quote_amount)+'</div><div>'+esc(x.quote_message||'')+'</div><div class="actions"><button class="primary" data-a="accept">Aceptar presupuesto</button><button class="primary danger" data-a="reject">Rechazar</button></div></div>';if(x.status==='accepted')a='<div class="status">✓ Presupuesto aceptado. El trabajo quedó contratado.</div><button class="primary" data-a="complete">Marcar trabajo completado</button>';if(x.status==='cancelled')a='<div class="empty">Presupuesto rechazado. No se generó contratación.</div>';if(x.status==='completed')a='<b>¿Cómo fue tu experiencia?</b><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star '+(n<=(x.rating||0)?'on':'')+'" data-star="'+n+'">★</button>').join('')+'</div><textarea data-comment placeholder="Comentario opcional">'+esc(x.comment||'')+'</textarea><button class="primary" data-a="review">Enviar valoración</button>';if(x.status==='reviewed')a='<div class="status">✓ Valoración enviada · '+('★'.repeat(x.rating||0))+'</div>';d.innerHTML='<b>'+esc(x.trade||'Servicio')+'</b><div class="muted">'+esc(x.zone||'')+'</div><div class="pill">'+esc(labels[x.status]||x.status)+'</div><p>'+esc(x.description||'')+'</p>'+a;d.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const all=list(),q=all.find(z=>z.id===x.id);q.rating=Number(b.dataset.star);save(all);renderClient()});d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>clientAction(x.id,b.dataset.a,d.querySelector('[data-comment]')?.value||''));box.appendChild(d)})}function clientAction(id,a,comment){const xs=list(),x=xs.find(z=>z.id===id);if(!x)return;if(a==='accept'&&x.status==='quoted')x.status='accepted';if(a==='reject'&&x.status==='quoted')x.status='cancelled';if(a==='complete'&&x.status==='accepted')x.status='completed';if(a==='review'&&x.status==='completed'){if(!x.rating){alert('Elegí de 1 a 5 estrellas.');return}x.status='reviewed';x.comment=comment}save(xs);renderClient()}function renderPro(){const box=$('proList'),xs=list();box.innerHTML='';if(!xs.length){box.innerHTML='<div class="empty">Todavía no hay pedidos para presupuestar.</div>';return}xs.forEach(x=>{const d=document.createElement('div');d.className='result';let a='';if(x.status==='pending')a='<div class="quote"><b>Armá tu presupuesto</b><input data-amount inputmode="numeric" placeholder="Importe en pesos"><textarea data-msg placeholder="Detalle: qué incluye, materiales, tiempo estimado, observaciones"></textarea><button class="primary" data-send>Enviar presupuesto al cliente</button></div>';if(x.status==='quoted')a='<div class="quote"><b>PRESUPUESTO ENVIADO</b><div class="price">'+money(x.quote_amount)+'</div><div>'+esc(x.quote_message||'')+'</div><div class="status">Esperando respuesta del cliente.</div></div>';if(x.status==='accepted')a='<div class="status">✓ El cliente aceptó tu presupuesto.</div>';if(x.status==='cancelled')a='<div class="empty">El cliente rechazó este presupuesto.</div>';if(x.status==='completed'||x.status==='reviewed')a='<div class="status">Trabajo completado'+(x.status==='reviewed'?' y valorado por el cliente.':'.')+'</div>';d.innerHTML='<b>'+esc(x.trade||'Servicio')+'</b><div class="muted">'+esc(x.zone||'')+' · Cliente de prueba</div><div class="pill">'+esc(labels[x.status]||x.status)+'</div><p>'+esc(x.description||'')+'</p>'+a;const send=d.querySelector('[data-send]');if(send)send.onclick=()=>{const amount=Number(String(d.querySelector('[data-amount]').value).replace(/[^0-9]/g,'')),msg=d.querySelector('[data-msg]').value.trim();if(!amount){alert('Ingresá un importe válido.');return}const all=list(),q=all.find(z=>z.id===x.id);q.quote_amount=amount;q.quote_message=msg;q.status='quoted';save(all);renderPro()};box.appendChild(d)})}function switchRole(){role=role==='client'?'professional':'client';$('client').classList.toggle('hidden',role!=='client');$('professional').classList.toggle('hidden',role!=='professional');$('roleTitle').textContent=role==='client'?'Vista cliente':'Vista profesional';$('switchRole').textContent=role==='client'?'Ver como profesional':'Volver como cliente';role==='client'?renderClient():renderPro();window.scrollTo({top:0,behavior:'smooth'})}$('switchRole').onclick=switchRole;renderClient()})();</script></body></html>
