<span>⌂</span>Inicio</button><button data-view="searchView"><span>⌕</span>Buscar</button><button data-view="requestsView"><span>▣</span>Solicitudes</button><button data-view="jobsView"><span>★</span>Bolsa</button><button data-view="accountView"><span>●</span>Mi cuenta</button></nav><script>(function(){'use strict';const $=id=>document.getElementById(id);if(!window.supabase){document.body.innerHTML='<div style="padding:30px">No se pudo cargar la conexión segura.</div>';return}const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),BUCKET='professional-work';const BARRIOS=['Agronomía','Almagro','Balvanera','Barracas','Belgrano','Boedo','Caballito','Chacarita','Coghlan','Colegiales','Constitución','Flores','Floresta','La Boca','La Paternal','Liniers','Mataderos','Monte Castro','Monserrat','Nueva Pompeya','Núñez','Palermo','Parque Avellaneda','Parque Chacabuco','Parque Chas','Parque Patricios','Puerto Madero','Recoleta','Retiro','Saavedra','San Cristóbal','San Nicolás','San Telmo','Vélez Sarsfield','Versalles','Villa Crespo','Villa del Parque','Villa Devoto','Villa General Mitre','Villa Lugano','Villa Luro','Villa Ortúzar','Villa Pueyrredón','Villa Real','Villa Riachuelo','Villa Santa Rita','Villa Soldati','Villa Urquiza'];const SERVICIOS=['Albañilería','Aire acondicionado','Alarmas y seguridad','Armado de muebles','Aislación térmica y acústica','Calefacción','Carpintería','Cerrajería','Colocación de cerámicos','Colocación de pisos','Construcción y reformas','Cortinas y persianas','Destapaciones','Durlock','Electricidad','Electrodomésticos','Fletes y mudanzas','Fumigación y control de plagas','Gas','Herrería','Impermeabilización','Instalación de cámaras','Jardinería','Limpieza','Mantenimiento general','Marmolería','Pintura','Piscinas','Plomería','Poda y mantenimiento de árboles','Porteros eléctricos','Pulido y plastificado de pisos','Refrigeración','Reparación de techos','Sanitarios','Tapicería','Techista','Toldos','Vidriería','Yesería','Zinguería'];const labels={pending:'Esperando presupuesto',quoted:'Presupuesto recibido',accepted:'Presupuesto aceptado',cancelled:'Presupuesto rechazado',completed:'Trabajo completado'};let user=null,profile=null,selectedPro=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0));const opt=a=>a.map(x=>'<option>'+esc(x)+'</option>').join('');const url=p=>!p?'':(/^https?:/i.test(p)?p:(db.storage.from(BUCKET).getPublicUrl(p).data?.publicUrl||''));async function track(name,meta={}){try{let sid=sessionStorage.getItem('resolve_session_id');if(!sid){sid=crypto.randomUUID();sessionStorage.setItem('resolve_session_id',sid)}await db.from('analytics_events').insert({event_name:name,session_id:sid,user_id:user?.id||null,source:'v3-final',path:location.pathname,metadata:meta})}catch(e){}}function msg(t,bad){return '<div class="msg" style="background:'+(bad?'#fff4dd':'#e8f7f2')+'">'+esc(t)+'</div>'}function showView(id){['homeView','searchView','requestsView','jobsView','accountView'].forEach(v=>$(v).classList.toggle('hidden',v!==id));window.scrollTo({top:0,behavior:'smooth'});if(id==='searchView')renderSearch();if(id==='requestsView')loadRequests();if(id==='jobsView')loadJobs();if(id==='accountView')renderAccount()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));async function init(){const s=await db.auth.getSession();if(!s.data.session){location.href='./';return}user=s.data.session.user;const p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error){alert(p.error.message);return}profile=p.data||{role:user.user_metadata?.role||'client',full_name:user.user_metadata?.full_name||''};renderHome();track('page_view',{role:profile.role});if(new URLSearchParams(location.search).get('confirmed')==='1')track('email_confirmed')}function renderHome(){if(profile.role==='professional')$('homeView').innerHTML='<div class="card hero-card"><span class="badge">CUENTA PROFESIONAL</span><h2 class="hero-title">Hola, '+esc(profile.full_name||'profesional')+'</h2><p class="lead">Completá tu perfil, revisá solicitudes y enviá tus presupuestos.</p><button id="goReq">Ver pedidos de presupuesto</button><button id="goAccount" class="secondary">Editar mi perfil</button></div>';else $('homeView').innerHTML='<div class="card hero-card"><span class="badge">CUENTA ACTIVA</span><h2 class="hero-title">¿Qué necesitás resolver hoy?</h2><p class="lead">Elegí un servicio y el barrio. Te mostramos profesionales disponibles.</p><div class="service-grid"><button class="service" data-q="Plomería"><span class="ico">🔧</span><b>Plomería</b></button><button class="service" data-q="Electricidad"><span class="ico">⚡</span><b>Electricidad</b></button><button class="service" data-q="Gas"><span class="ico">🔥</span><b>Gas</b></button><button class="service" data-q="Pintura"><span class="ico">🎨</span><b>Pintura</b></button></div><button id="goSearch">Buscar profesional</button></div>';setTimeout(()=>{if($('goReq'))$('goReq').onclick=()=>showView('requestsView');if($('goAccount'))$('goAccount').onclick=()=>showView('accountView');if($('goSearch'))$('goSearch').onclick=()=>showView('searchView');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('resolve_trade',b.dataset.q);showView('searchView')})},0)}function renderSearch(){if(profile.role==='professional'){$('searchView').innerHTML='<div class="card"><h2>Buscar profesionales</h2><p class="lead">Esta sección está pensada para clientes.</p></div>';return}$('searchView').innerHTML='<div class="card"><h2>Buscar profesional</h2><select id="zone"><option value="">Elegí barrio de CABA</option>'+opt(BARRIOS)+'</select><select id="trade"><option value="">Elegí servicio u oficio</option>'+opt(SERVICIOS)+'</select><button id="searchBtn">Ver profesionales</button><div id="searchResults"></div></div><div id="profileBox"></div><div id="requestBox"></div>';const saved=sessionStorage.getItem('resolve_trade');if(saved){$('trade').value=saved;sessionStorage.removeItem('resolve_trade')}$('searchBtn').onclick=searchPros}async function searchPros(){const zone=$('zone').value,trade=$('trade').value;if(!zone){$('searchResults').innerHTML=msg('Elegí un barrio.',true);return}let q=db.from('professional_directory').select('*');if(trade)q=q.eq('trade',trade);q=q.ilike('zone','%'+zone+'%').limit(30);const r=await q;$('searchResults').innerHTML='';if(r.error){$('searchResults').innerHTML=msg(r.error.message,true);return}if(!r.data?.length){$('searchResults').innerHTML=msg('No encontramos profesionales con esos filtros.',true);return}r.data.forEach(p=>{const d=document.createElement('div');d.className='result';const av=url(p.profile_photo_path);d.innerHTML='<div class="prohead"><div class="avatar">'+(av?'<img src="'+esc(av)+'">':esc((p.full_name||'P').slice(0,1)))+'</div><div><b>'+esc(p.full_name||'Profesional')+'</b><div class="muted">'+esc(p.trade||'')+' · '+esc(p.zone||'')+'</div><div>★ '+Number(p.rating||0).toFixed(1)+' ('+Number(p.review_count||0)+')</div></div></div><button>Ver perfil</button>';d.querySelector('button').onclick=()=>openProfile(p);$('searchResults').appendChild(d)})}async function openProfile(p){selectedPro=p;const [ph,rv]=await Promise.all([db.from('professional_photos').select('*').eq('professional_id',p.id).order('created_at',{ascending:false}),db.from('reviews').select('rating,comment,created_at').eq('professional_id',p.id).order('created_at',{ascending:false}).limit(20)]);const av=url(p.profile_photo_path);$('profileBox').innerHTML='<div class="card"><div class="prohead"><div class="avatar">'+(av?'<img src="'+esc(av)+'">':esc((p.full_name||'P').slice(0,1)))+'</div><div><h2>'+esc(p.full_name||'Profesional')+'</h2><div class="muted">'+esc(p.trade||'')+' · '+esc(p.zone||'')+'</div></div></div><p>'+esc(p.bio||'Sin descripción todavía.')+'</p><h3>Trabajos realizados</h3><div class="gallery">'+((ph.data||[]).map(x=>'<img src="'+esc(url(x.storage_path))+'" alt="Trabajo realizado">').join('')||'<div class="muted">Sin fotos todavía.</div>')+'</div><h3>Valoraciones</h3>'+((rv.data||[]).map(x=>'<div class="item">'+('★'.repeat(x.rating||0))+'<p>'+esc(x.comment||'')+'</p></div>').join('')||'<div class="muted">Sin valoraciones todavía.</div>')+'<button id="askQuote">Pedir presupuesto</button></div>';$('askQuote').onclick=()=>{$('requestBox').innerHTML='<div class="card"><h2>Pedir presupuesto</h2><p class="lead">El profesional define el precio. Vos decidís si aceptar o rechazar.</p><select id="reqZone"><option>'+esc(p.zone||'')+'</option>'+opt(BARRIOS.filter(x=>x!==p.zone))+'</select><textarea id="reqDesc" placeholder="Contá qué necesitás resolver"></textarea><button id="sendReq">Enviar pedido</button><div id="reqMsg"></div></div>';$('sendReq').onclick=sendRequest;$('requestBox').scrollIntoView({behavior:'smooth'})}}async function sendRequest(){const desc=$('reqDesc').value.trim();if(!desc){$('reqMsg').innerHTML=msg('Describí el trabajo.',true);return}const phone=profile.phone||user.user_metadata?.phone||null;if(!phone){$('reqMsg').innerHTML=msg('Tu cuenta no tiene teléfono. Agregalo en Mi cuenta.',true);return}const r=await db.from('service_requests').insert({client_id:user.id,client_name:profile.full_name||'Cliente',client_phone:phone,client_email:user.email,professional_id:selectedPro.id,trade:selectedPro.trade,zone:$('reqZone').value,description:desc,status:'pending'}).select('*').single();if(r.error){$('reqMsg').innerHTML=msg(r.error.message,true);return}$('reqMsg').innerHTML=msg('Pedido enviado.');track('service_request_created',{request_id:r.data.id});setTimeout(()=>showView('requestsView'),500)}async function loadRequests(){const box=$('requestsView');box.innerHTML='<div class="card"><h2>'+(profile.role==='professional'?'Pedidos de presupuesto':'Mis solicitudes')+'</h2><div id="requestList">Cargando…</div></div>';const r=profile.role==='professional'?await db.from('service_requests').select('*').eq('professional_id',user.id).order('created_at',{ascending:false}):await db.from('service_requests').select('*').eq('client_id',user.id).order('created_at',{ascending:false});const list=$('requestList');list.innerHTML='';if(r.error){list.innerHTML=msg(r.error.message,true);return}if(!r.data?.length){list.innerHTML=msg('Todavía no hay solicitudes.',true);return}for(const x of r.data){const d=document.createElement('div');d.className='result';let actions='';if(profile.role==='professional'&&x.status==='pending')actions='<div class="quote"><input data-amount inputmode="numeric" placeholder="Importe en pesos"><textarea data-detail placeholder="Detalle obligatorio del presupuesto"></textarea><button data-send>Enviar presupuesto</button></div>';if(profile.role==='client'&&x.status==='quoted')actions='<div class="quote"><div class="price">'+money(x.quote_amount)+'</div><div>'+esc(x.quote_message||'')+'</div><div class="actions"><button data-accept>Aceptar</button><button data-reject class="danger">Rechazar</button></div></div>';if(x.status==='accepted')actions='<div class="msg">Presupuesto aceptado.</div><button data-complete>Marcar trabajo completado</button>';if(x.status==='cancelled')actions='<div class="msg">Presupuesto rechazado.</div>';if(x.status==='completed'&&profile.role==='client'){const rv=await db.from('reviews').select('id,rating').eq('service_request_id',x.id).maybeSingle();actions=rv.data?'<div class="msg">Valorado · '+('★'.repeat(rv.data.rating||0))+'</div>':'<div><b>¿Cómo fue tu experiencia?</b><div>'+[1,2,3,4,5].map(n=>'<button class="starbtn" data-star="'+n+'">★</button>').join('')+'</div><textarea data-comment placeholder="Comentario opcional"></textarea><button data-review>Enviar valoración</button></div>'}d.innerHTML='<b>'+esc(x.trade||'Servicio')+'</b><div class="muted">'+esc(x.zone||'')+(profile.role==='professional'?' · '+esc(x.client_name||'Cliente'):'')+'</div><span class="pill">'+esc(labels[x.status]||x.status)+'</span><p>'+esc(x.description||'')+'</p>'+actions;const send=d.querySelector('[data-send]');if(send)send.onclick=async()=>{const amount=Number(String(d.querySelector('[data-amount]').value).replace(/[^0-9]/g,'')),detail=d.querySelector('[data-detail]').value.trim();if(!amount||!detail){alert('Completá importe y detalle.');return}const u=await db.from('service_requests').update({quote_amount:amount,quote_message:detail,quoted_at:new Date().toISOString(),status:'quoted',updated_at:new Date().toISOString()}).eq('id',x.id).eq('professional_id',user.id).eq('status','pending').select('*').maybeSingle();if(u.error)alert(u.error.message);else{track('quote_sent',{request_id:x.id,amount});loadRequests()}};const ac=d.querySelector('[data-accept]');if(ac)ac.onclick=()=>changeStatus(x,'accepted');const re=d.querySelector('[data-reject]');if(re)re.onclick=()=>changeStatus(x,'cancelled');const cp=d.querySelector('[data-complete]');if(cp)cp.onclick=()=>changeStatus(x,'completed');let rating=0;d.querySelectorAll('[data-star]').forEach((s,i)=>s.onclick=()=>{rating=Number(s.dataset.star);d.querySelectorAll('[data-star]').forEach((z,j)=>z.classList.toggle('on',j<rating))});const rb=d.querySelector('[data-review]');if(rb)rb.onclick=async()=>{if(!rating){alert('Elegí de 1 a 5 estrellas.');return}const rr=await db.from('reviews').insert({service_request_id:x.id,client_id:user.id,professional_id:x.professional_id,rating,comment:d.querySelector('[data-comment]').value.trim()||null});if(rr.error)alert(rr.error.message);else{track('review_created',{request_id:x.id,rating});loadRequests()}};list.appendChild(d)}}async function changeStatus(x,next){let q=db.from('service_requests').update({status:next,updated_at:new Date().toISOString()}).eq('id',x.id).eq('status',x.status);q=profile.role==='professional'?q.eq('professional_id',user.id):q.eq('client_id',user.id);const r=await q.select('*').maybeSingle();if(r.error)alert(r.error.message);else{track('request_status_changed',{request_id:x.id,status:next});loadRequests()}}async function loadJobs(){const box=$('jobsView');box.innerHTML='<div class="card"><h2>Bolsa de trabajo</h2><div id="jobCreate"></div><div id="jobList">Cargando…</div></div>';if(profile.role==='client')$('jobCreate').innerHTML='<h3>Publicar búsqueda</h3><input id="jobTitle" placeholder="Ej.: Busco electricista"><select id="jobTrade"><option value="">Oficio</option>'+opt(SERVICIOS)+'</select><select id="jobZone"><option value="">Barrio</option>'+opt(BARRIOS)+'</select><textarea id="jobDesc" placeholder="Descripción del puesto o trabajo"></textarea><button id="createJob">Publicar</button>';$('createJob')&&($('createJob').onclick=createJob);const r=await db.from('job_posts').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(50);const list=$('jobList');list.innerHTML='';if(r.error){list.innerHTML=msg(r.error.message,true);return}if(!r.data?.length){list.innerHTML=msg('Todavía no hay publicaciones.',true);return}r.data.forEach(j=>{const d=document.createElement('div');d.className='result';d.innerHTML='<b>'+esc(j.title||'Trabajo')+'</b><div class="muted">'+esc(j.trade||'')+' · '+esc(j.zone||'')+'</div><p>'+esc(j.description||'')+'</p>'+(profile.role==='professional'?'<textarea data-appmsg placeholder="Mensaje opcional"></textarea><button data-apply>Postularme</button>':'');const ap=d.querySelector('[data-apply]');if(ap)ap.onclick=async()=>{const rr=await db.from('job_applications').insert({applicant_id:user.id,applicant_name:profile.full_name||'Profesional',applicant_phone:profile.phone||'',job_id:j.id,message:d.querySelector('[data-appmsg]').value.trim()||null,status:'pending'});if(rr.error)alert(rr.error.code==='23505'?'Ya te postulaste a esta publicación.':rr.error.message);else{track('job_application_created',{job_id:j.id});alert('Postulación enviada.')}};list.appendChild(d)})}async function createJob(){const title=$('jobTitle').value.trim(),description=$('jobDesc').value.trim();if(!title||!description){alert('Completá título y descripción.');return}const r=await db.from('job_posts').insert({employer_id:user.id,title,description,trade:$('jobTrade').value||null,zone:$('jobZone').value||null,is_active:true});if(r.error)alert(r.error.message);else{track('job_post_created');loadJobs()}}function renderAccount(){if(profile.role==='professional')$('accountView').innerHTML='<div class="card"><h2>Mi perfil profesional</h2><input id="fullName" value="'+esc(profile.full_name||'')+'" placeholder="Nombre y apellido"><input id="phone" value="'+esc(profile.phone||'')+'" placeholder="Teléfono"><select id="proTrade"><option value="">Oficio</option>'+opt(SERVICIOS)+'</select><select id="proZone"><option value="">Barrio principal</option>'+opt(BARRIOS)+'</select><textarea id="bio" placeholder="Experiencia y servicios">'+esc(profile.bio||'')+'</textarea><button id="saveProfile">Guardar perfil</button><h3>Foto de perfil</h3><input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp"><button id="uploadAvatar" class="secondary">Subir foto de perfil</button><h3>Fotos de trabajos</h3><input id="workPhoto" type="file" accept="image/jpeg,image/png,image/webp"><input id="workCaption" placeholder="Descripción breve"><button id="uploadWork" class="secondary">Agregar foto</button><div id="ownGallery" class="gallery"></div><hr><button id="logout" class="danger">Cerrar sesión</button></div>';else $('accountView').innerHTML='<div class="card"><h2>Mi cuenta</h2><input id="fullName" value="'+esc(profile.full_name||'')+'" placeholder="Nombre y apellido"><input id="phone" value="'+esc(profile.phone||'')+'" placeholder="Teléfono"><button id="saveProfile">Guardar datos</button><hr><button id="logout" class="danger">Cerrar sesión</button></div>';if($('proTrade'))$('proTrade').value=profile.trade||'';if($('proZone'))$('proZone').value=profile.zone||'';$('saveProfile').onclick=saveProfile;$('logout').onclick=async()=>{await db.auth.signOut();location.href='./'};if(profile.role==='professional'){$('uploadAvatar').onclick=uploadAvatar;$('uploadWork').onclick=uploadWork;loadOwnGallery()}}async function saveProfile(){const values={full_name:$('fullName').value.trim(),phone:$('phone').value.trim(),updated_at:new Date().toISOString()};if(profile.role==='professional'){values.trade=$('proTrade').value||null;values.zone=$('proZone').value||null;values.bio=$('bio').value.trim()||null;values.is_active=true}const r=await db.from('profiles').update(values).eq('id',user.id).select('*').single();if(r.error)alert(r.error.message);else{profile=r.data;renderHome();alert('Datos guardados.')}}async function uploadAvatar(){const f=$('profilePhoto').files?.[0];if(!f||f.size>5*1024*1024){alert('Elegí una imagen de hasta 5 MB.');return}const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/profile/profile-'+Date.now()+'.'+ext;const up=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(up.error){alert(up.error.message);return}const old=profile.profile_photo_path;const sv=await db.from('profiles').update({profile_photo_path:up.data.path,updated_at:new Date().toISOString()}).eq('id',user.id).select('*').single();if(sv.error)alert(sv.error.message);else{profile=sv.data;if(old&&!/^https?:/i.test(old))await db.storage.from(BUCKET).remove([old]);alert('Foto actualizada.')}}async function uploadWork(){const f=$('workPhoto').files?.[0];if(!f||f.size>5*1024*1024){alert('Elegí una imagen de hasta 5 MB.');return}const c=await db.from('professional_photos').select('id',{count:'exact',head:true}).eq('professional_id',user.id);if((c.count||0)>=3){alert('Podés subir hasta 3 fotos.');return}const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/work/'+Date.now()+'.'+ext;const up=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(up.error){alert(up.error.message);return}const row=await db.from('professional_photos').insert({professional_id:user.id,storage_path:up.data.path,caption:$('workCaption').value.trim()||null});if(row.error)alert(row.error.message);else loadOwnGallery()}async function loadOwnGallery(){const r=await db.from('professional_photos').select('*').eq('professional_id',user.id).order('created_at',{ascending:false});$('ownGallery').innerHTML=(r.data||[]).map(x=>'<img src="'+esc(url(x.storage_path))+'">').join('')||'<div class="muted">Todavía no subiste fotos.</div>'}init()})();</script></body></html>
