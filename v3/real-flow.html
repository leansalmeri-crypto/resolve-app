<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RESOLVÉ · Prueba real</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef6fa;color:#10283d}.head{padding:24px 20px;background:linear-gradient(135deg,#0d4169,#175a8b);color:#fff;border-radius:0 0 26px 26px}.wrap{max-width:620px;margin:auto;padding:16px 14px 80px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 30px #173c5515}.badge{display:inline-block;background:#e8f7f2;color:#16644e;border-radius:99px;padding:7px 11px;font-weight:800;font-size:12px}.primary,.secondary,.danger{width:100%;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:800;margin-top:10px}.primary{background:#175a8b;color:#fff}.secondary{background:#eaf5fb;color:#0d4169}.danger{background:#fff0f0;color:#9b2226}.hidden{display:none!important}input,textarea,select{width:100%;padding:14px;border:1px solid #dbe6ec;border-radius:14px;background:#fbfdfe;font:inherit;margin:6px 0}textarea{min-height:90px}.muted{color:#6c7d8c}.result{border:1px solid #dbe6ec;border-radius:16px;padding:14px;margin:10px 0}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#edf4f8;font-size:12px;font-weight:700}.status{padding:12px;border-radius:12px;background:#e8f7f2;margin-top:10px}.empty{padding:12px;border-radius:12px;background:#fff4dd;color:#6b5314;margin-top:10px}.quote{background:#f2f8fc;border:1px solid #d6e7f0;border-radius:14px;padding:12px;margin-top:10px}.price{font-size:26px;font-weight:900;color:#0d4169}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stars{display:flex;gap:3px}.star{font-size:34px;border:0;background:none;color:#c8d0d6}.star.on{color:#f5b301}</style></head><body><header class="head"><h1 style="margin:0">RESOLVÉ</h1><div>Prueba real · datos guardados en Supabase</div></header><main class="wrap"><section id="login" class="card"><span class="badge">PRUEBA REAL</span><h2>Ingresar</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn" class="primary">Ingresar</button><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="card"><div id="who"></div><button id="logout" class="secondary">Cerrar sesión</button></div><section id="client" class="hidden"><div class="card"><h2>Buscar profesional</h2><select id="trade"><option value="">Todos los oficios</option><option>Plomería</option><option>Electricidad</option><option>Gas</option><option>Pintura</option><option>Carpintería</option><option>Albañilería</option></select><input id="zone" placeholder="Barrio, ej. Palermo"><button id="searchBtn" class="primary">Buscar</button><div id="results"></div></div><div class="card hidden" id="requestBox"><h2>Pedir presupuesto</h2><div id="selected"></div><textarea id="description" placeholder="Describí el trabajo"></textarea><button id="sendRequest" class="primary">Enviar pedido</button><div id="requestMsg"></div></div><div class="card"><h2>Mis solicitudes</h2><button id="reloadClient" class="secondary">Actualizar</button><div id="clientRequests"></div></div></section><section id="professional" class="hidden"><div class="card"><h2>Pedidos de presupuesto</h2><button id="reloadPro" class="secondary">Actualizar</button><div id="proRequests"></div></div></section></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id);const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true}});let user=null,profile=null,selectedPro=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0));const label={pending:'Esperando presupuesto',quoted:'Presupuesto recibido',accepted:'Presupuesto aceptado',cancelled:'Presupuesto rechazado',completed:'Trabajo completado'};function show(el,t,bad){el.innerHTML='<div class="'+(bad?'empty':'status')+'">'+esc(t)+'</div>'}async function track(name,meta={}){try{let sid=sessionStorage.getItem('resolve_session_id');if(!sid){sid=crypto.randomUUID();sessionStorage.setItem('resolve_session_id',sid)}await db.from('analytics_events').insert({event_name:name,session_id:sid,user_id:user?.id||null,source:'qa-real',path:location.pathname,metadata:meta})}catch(e){}}async function start(){const s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;await enter()}else track('page_view',{page:'real_flow'})}async function enter(){const p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error){show($('loginMsg'),p.error.message,true);return}profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').innerHTML='<b>'+esc(profile?.full_name||user.email)+'</b><div class="muted">'+esc(profile?.role||'client')+' · '+esc(user.email||'')+'</div>';if(profile?.role==='professional'){$('professional').classList.remove('hidden');$('client').classList.add('hidden');await loadPro()}else{$('client').classList.remove('hidden');$('professional').classList.add('hidden');await loadClient()}track('login_success',{role:profile?.role||'client'})}$('loginBtn').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show($('loginMsg'),r.error.message,true);user=r.data.user;await enter()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('searchBtn').onclick=async()=>{let q=db.from('professional_directory').select('*');const tr=$('trade').value.trim(),z=$('zone').value.trim();if(tr)q=q.eq('trade',tr);if(z)q=q.ilike('zone','%'+z+'%');const r=await q.limit(20);$('results').innerHTML='';if(r.error)return show($('results'),r.error.message,true);if(!r.data?.length)return show($('results'),'No encontramos profesionales.',true);r.data.forEach(p=>{const d=document.createElement('div');d.className='result';d.innerHTML='<b>'+esc(p.full_name||'Profesional')+'</b><div class="muted">'+esc(p.trade||'')+' · '+esc(p.zone||'')+'</div><button class="primary">Pedir presupuesto</button>';d.querySelector('button').onclick=()=>{selectedPro=p;$('selected').innerHTML='<b>'+esc(p.full_name)+'</b><div class="muted">'+esc(p.trade)+' · '+esc(p.zone)+'</div>';$('requestBox').classList.remove('hidden')};$('results').appendChild(d)})};$('sendRequest').onclick=async()=>{if(!selectedPro)return;const desc=$('description').value.trim();if(!desc)return show($('requestMsg'),'Describí el trabajo.',true);const phone=profile?.phone||user.user_metadata?.phone||null;if(!phone)return show($('requestMsg'),'Tu perfil no tiene teléfono guardado.',true);const r=await db.from('service_requests').insert({client_id:user.id,client_name:profile?.full_name||'Cliente',client_phone:phone,client_email:user.email,professional_id:selectedPro.id,trade:selectedPro.trade,zone:selectedPro.zone,description:desc,status:'pending'}).select('*').single();if(r.error)return show($('requestMsg'),r.error.message,true);show($('requestMsg'),'Pedido enviado.');$('description').value='';track('service_request_created',{request_id:r.data.id});await loadClient()};async function loadClient(){const r=await db.from('service_requests').select('*').eq('client_id',user.id).order('created_at',{ascending:false});const box=$('clientRequests');box.innerHTML='';if(r.error)return show(box,r.error.message,true);if(!r.data?.length)return show(box,'Todavía no hay solicitudes.',true);for(const x of r.data){const d=document.createElement('div');d.className='result';let a='';if(x.status==='pending')a='<div class="status">Esperando presupuesto.</div>';if(x.status==='quoted')a='<div class="quote"><div class="price">'+money(x.quote_amount)+'</div><div>'+esc(x.quote_message||'')+'</div><div class="actions"><button class="primary" data-a="accept">Aceptar</button><button class="danger" data-a="reject">Rechazar</button></div></div>';if(x.status==='accepted')a='<div class="status">Presupuesto aceptado.</div><button class="primary" data-a="complete">Marcar completado</button>';if(x.status==='cancelled')a='<div class="empty">Presupuesto rechazado.</div>';if(x.status==='completed'){const rv=await db.from('reviews').select('id,rating').eq('service_request_id',x.id).maybeSingle();a=rv.data?'<div class="status">Ya valorado · '+('★'.repeat(rv.data.rating||0))+'</div>':'<div><b>Valorar</b><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star" data-star="'+n+'">★</button>').join('')+'</div><textarea data-comment placeholder="Comentario opcional"></textarea><button class="primary" data-review>Enviar valoración</button></div>'}d.innerHTML='<b>'+esc(x.trade||'Servicio')+'</b><div class="muted">'+esc(x.zone||'')+'</div><div class="pill">'+esc(label[x.status]||x.status)+'</div><p>'+esc(x.description||'')+'</p>'+a;d.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const next=b.dataset.a==='accept'?'accepted':b.dataset.a==='reject'?'cancelled':'completed';const u=await db.from('service_requests').update({status:next,updated_at:new Date().toISOString()}).eq('id',x.id).eq('client_id',user.id).eq('status',x.status).select('*').maybeSingle();if(u.error)return alert(u.error.message);track('request_status_changed',{request_id:x.id,status:next});loadClient()});let rating=0;d.querySelectorAll('[data-star]').forEach(s=>s.onclick=()=>{rating=Number(s.dataset.star);d.querySelectorAll('[data-star]').forEach((z,i)=>z.classList.toggle('on',i<rating))});const rb=d.querySelector('[data-review]');if(rb)rb.onclick=async()=>{if(!rating)return alert('Elegí de 1 a 5 estrellas.');const rr=await db.from('reviews').insert({service_request_id:x.id,client_id:user.id,professional_id:x.professional_id,rating,comment:d.querySelector('[data-comment]').value.trim()||null});if(rr.error)return alert(rr.error.message);track('review_created',{request_id:x.id,rating});loadClient()};box.appendChild(d)}}async function loadPro(){const r=await db.from('service_requests').select('*').eq('professional_id',user.id).order('created_at',{ascending:false});const box=$('proRequests');box.innerHTML='';if(r.error)return show(box,r.error.message,true);if(!r.data?.length)return show(box,'Todavía no recibiste pedidos.',true);r.data.forEach(x=>{const d=document.createElement('div');d.className='result';let a='';if(x.status==='pending')a='<div class="quote"><input data-amount inputmode="numeric" placeholder="Importe en pesos"><textarea data-msg placeholder="Detalle obligatorio del presupuesto"></textarea><button class="primary" data-send>Enviar presupuesto</button></div>';if(x.status==='quoted')a='<div class="quote"><div class="price">'+money(x.quote_amount)+'</div><div>'+esc(x.quote_message||'')+'</div><div class="status">Esperando respuesta del cliente.</div></div>';if(x.status==='accepted')a='<div class="status">El cliente aceptó.</div><button class="primary" data-complete>Marcar trabajo completado</button>';if(x.status==='cancelled')a='<div class="empty">El cliente rechazó el presupuesto.</div>';if(x.status==='completed')a='<div class="status">Trabajo completado.</div>';d.innerHTML='<b>'+esc(x.trade||'Servicio')+'</b><div class="muted">'+esc(x.zone||'')+' · '+esc(x.client_name||'Cliente')+'</div><div class="pill">'+esc(label[x.status]||x.status)+'</div><p>'+esc(x.description||'')+'</p>'+a;const send=d.querySelector('[data-send]');if(send)send.onclick=async()=>{const amount=Number(String(d.querySelector('[data-amount]').value).replace(/[^0-9]/g,'')),msg=d.querySelector('[data-msg]').value.trim();if(!amount||!msg)return alert('Completá importe y detalle.');const u=await db.from('service_requests').update({quote_amount:amount,quote_message:msg,quoted_at:new Date().toISOString(),status:'quoted',updated_at:new Date().toISOString()}).eq('id',x.id).eq('professional_id',user.id).eq('status','pending').select('*').maybeSingle();if(u.error)return alert(u.error.message);track('quote_sent',{request_id:x.id,amount});loadPro()};const cp=d.querySelector('[data-complete]');if(cp)cp.onclick=async()=>{const u=await db.from('service_requests').update({status:'completed',updated_at:new Date().toISOString()}).eq('id',x.id).eq('professional_id',user.id).eq('status','accepted').select('*').maybeSingle();if(u.error)return alert(u.error.message);track('request_status_changed',{request_id:x.id,status:'completed'});loadPro()};box.appendChild(d)})}$('reloadClient').onclick=loadClient;$('reloadPro').onclick=loadPro;start()})();</script></body></html>
