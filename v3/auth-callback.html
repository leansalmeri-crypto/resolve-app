<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RESOLVÉ · Confirmando cuenta</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#eef6fa;color:#10283d}.box{max-width:520px;margin:18vh auto;padding:24px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 35px #173c551a}h1{color:#175a8b}.msg{line-height:1.5}</style></head><body><main class="box"><div class="card"><h1>RESOLVÉ</h1><div id="msg" class="msg">Confirmando tu cuenta…</div></div></main><script>(async function(){const msg=document.getElementById('msg'),qs=new URLSearchParams(location.search),share=qs.get('_vercel_share')||'';function go(path,params={}){const u=new URL(path,location.origin);Object.entries(params).forEach(([k,v])=>v&&u.searchParams.set(k,v));if(share)u.searchParams.set('_vercel_share',share);location.replace(u.href)}if(!window.supabase){msg.textContent='No se pudo cargar la conexión segura.';return}const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{let session=(await db.auth.getSession()).data.session;if(!session&&qs.get('code')){const ex=await db.auth.exchangeCodeForSession(qs.get('code'));if(ex.error)throw ex.error;session=ex.data.session}if(!session){await new Promise(r=>setTimeout(r,500));session=(await db.auth.getSession()).data.session}if(!session){msg.textContent='La cuenta fue confirmada. Ingresá con tu email y contraseña.';setTimeout(()=>go('/v3/'),900);return}const user=session.user,meta=user.user_metadata||{},role=meta.role==='professional'?'professional':'client';const existing=await db.from('profiles').select('id').eq('id',user.id).maybeSingle();if(existing.error)throw existing.error;if(!existing.data){const ins=await db.from('profiles').insert({id:user.id,full_name:meta.full_name||user.email?.split('@')[0]||'Usuario',role,phone:meta.phone||null,is_active:role==='professional'?false:true});if(ins.error)throw ins.error}msg.textContent='✓ Cuenta confirmada. Entrando a RESOLVÉ…';setTimeout(()=>go('/v3/welcome.html',{confirmed:'1',role}),450)}catch(e){msg.textContent='La cuenta se confirmó, pero no pudimos completar el perfil automáticamente. Ingresá desde RESOLVÉ.';setTimeout(()=>go('/v3/'),1300)}})();</script></body></html>
