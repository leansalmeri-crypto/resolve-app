<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RESOLVÉ · Administración</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef6fa;color:#10283d}.head{padding:24px 18px;background:#0d4169;color:#fff}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #173c5515}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#f7fbfd;border:1px solid #dbe6ec;border-radius:15px;padding:15px}.n{font-size:30px;font-weight:900;color:#175a8b}.muted{color:#6c7d8c}.hidden{display:none!important}input,button{width:100%;padding:14px;border-radius:13px;font:inherit;margin:6px 0}input{border:1px solid #dbe6ec}button{border:0;background:#175a8b;color:#fff;font-weight:800}.row{padding:10px 0;border-bottom:1px solid #edf1f3}.bad{background:#fff4dd;padding:12px;border-radius:12px;color:#6b5314}</style></head><body><header class="head"><h1 style="margin:0">RESOLVÉ · Administración</h1><div>Actividad, altas y operaciones</div></header><main class="wrap"><section id="login" class="card"><h2>Ingreso administrador</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">Ingresar</button><div id="msg"></div></section><section id="dash" class="hidden"><div class="card"><div id="who"></div><button id="refresh">Actualizar métricas</button><button id="logout">Cerrar sesión</button></div><div class="card"><h2>Resumen</h2><div id="metrics" class="grid"></div></div><div class="card"><h2>Actividad reciente</h2><div id="events"></div></div><div class="card"><h2>Últimas inscripciones</h2><div id="profiles"></div></div></section></main><script>(function(){const $=id=>document.getElementById(id);const db=window.supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function enter(){const u=(await db.auth.getUser()).data.user;if(!u)return;const p=await db.from('profiles').select('full_name,role').eq('id',u.id).maybeSingle();if(p.data?.role!=='admin'){await db.auth.signOut();$('msg').innerHTML='<div class="bad">Esta cuenta no es administradora.</div>';return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');$('who').innerHTML='<b>'+esc(p.data.full_name||'Administrador')+'</b><div class="muted">Panel protegido</div>';load()}async function count(table,filter){let q=db.from(table).select('*',{count:'exact',head:true});if(filter)q=q.eq(filter[0],filter[1]);const r=await q;return r.count||0}async function load(){const [profiles,clients,pros,requests,reviews,jobs,apps,events]=await Promise.all([count('profiles'),count('profiles',['role','client']),count('profiles',['role','professional']),count('service_requests'),count('reviews'),count('job_posts'),count('job_applications'),count('analytics_events')]);const ev=await db.from('analytics_events').select('event_name,source,path,created_at').order('created_at',{ascending:false}).limit(30);const pr=await db.from('profiles').select('full_name,role,created_at').order('created_at',{ascending:false}).limit(20);const vals=[['Usuarios',profiles],['Clientes',clients],['Profesionales',pros],['Solicitudes',requests],['Valoraciones',reviews],['Empleos',jobs],['Postulaciones',apps],['Eventos/visitas',events]];$('metrics').innerHTML=vals.map(x=>'<div class="metric"><div class="n">'+x[1]+'</div><b>'+x[0]+'</b></div>').join('');$('events').innerHTML=ev.data?.length?ev.data.map(x=>'<div class="row"><b>'+esc(x.event_name)+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('es-AR')+' · '+esc(x.source||'')+' '+esc(x.path||'')+'</div></div>').join(''):'<div class="bad">Todavía no hay eventos registrados.</div>';$('profiles').innerHTML=pr.data?.length?pr.data.map(x=>'<div class="row"><b>'+esc(x.full_name||'Sin nombre')+'</b><div class="muted">'+esc(x.role)+' · '+new Date(x.created_at).toLocaleString('es-AR')+'</div></div>').join(''):'<div class="bad">Sin inscripciones.</div>'}$('loginBtn').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('msg').innerHTML='<div class="bad">'+esc(r.error.message)+'</div>';return}enter()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};enter()})();</script></body></html>
