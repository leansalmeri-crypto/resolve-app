<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ingresar · RESOLVÉ</title><meta name="theme-color" content="#244f75"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f2e8;color:#23344d;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px #173b6720}.brand{font-weight:900;font-size:24px;color:#244f75;margin-bottom:4px}.sub{color:#6a7787;margin:0 0 18px}.field{display:block;width:100%;height:52px;padding:0 14px;border:1px solid #d7dee8;border-radius:14px;font-size:16px;background:#fff;color:#1f2f46;margin:10px 0;appearance:none;-webkit-appearance:none;pointer-events:auto;touch-action:manipulation}.pass{position:relative}.pass .field{padding-right:54px}.eye{position:absolute;right:7px;top:15px;width:40px;height:40px;border:0;border-radius:10px;background:#f2f4f7;font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#244f75;color:white;font-size:16px;font-weight:900;margin-top:8px}.link{display:block;text-align:center;margin-top:14px;color:#244f75;font-weight:700;text-decoration:none}.msg{min-height:24px;margin-top:12px;font-size:14px}.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#244f75;font-weight:700}</style></head><body><main class="card"><a class="back" href="/">← Volver</a><div class="brand">RESOLVÉ</div><p class="sub">Ingresá a tu cuenta.</p><input id="email" class="field" type="email" inputmode="email" autocomplete="username" placeholder="Email"><div class="pass"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña"><button class="eye" type="button" aria-label="Mostrar contraseña">👁️</button></div><button id="login" class="btn" type="button">INGRESAR</button><div id="msg" class="msg"></div><a class="link" href="/registro.html">Crear mi cuenta gratis</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://birlzgiwoswenizlsmqu.supabase.co','sb_publishable_XXkcnb6fngBwyyh0NW7gbg_JX5fxRuL');const p=document.getElementById('password'),eye=document.querySelector('.eye');eye.addEventListener('click',()=>{p.type=p.type==='password'?'text':'password';eye.textContent=p.type==='password'?'👁️':'🙈';p.focus()});async function login(){const msg=document.getElementById('msg'),email=document.getElementById('email').value.trim(),password=p.value;if(!email||!password){msg.textContent='Completá email y contraseña.';msg.style.color='#a33';return}msg.textContent='Ingresando…';msg.style.color='#52657a';const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent='No se pudo ingresar. Revisá el email y la contraseña.';msg.style.color='#a33';return}const{data:profile}=await sb.from('profiles').select('role').eq('id',data.user.id).maybeSingle();location.href=profile?.role==='admin'?'/admin.html':'/?login=ok'}document.getElementById('login').addEventListener('click',login);p.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
